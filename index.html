<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكتاب الذكي - مكتبة إسلام</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f4f9; /* لون رمادي فاتح خارج الهاتف */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* تصميم شاشة الهاتف */
        .app-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            height: 100vh; 
            max-height: 800px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        
        /* الإطار الذهبي المطابق للغلاف */
        .app-container::before {
            content: '';
            position: absolute;
            top: 15px; bottom: 15px; left: 15px; right: 15px;
            border: 2px solid #d4af37;
            border-radius: 15px;
            pointer-events: none;
            z-index: 10;
        }
        /* الإطار الأخضر الداخلي */
        .app-container::after {
            content: '';
            position: absolute;
            top: 22px; bottom: 22px; left: 22px; right: 22px;
            border: 1px dashed #1a8c4b;
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }
        
        .header {
            text-align: center;
            margin-top: 50px;
            z-index: 2;
        }
        .logo-icon { width: 50px; fill: none; stroke: #1a8c4b; stroke-width: 1.5; margin-bottom: 5px;}
        .header h2 { margin: 0; color: #1a8c4b; font-weight: 900; font-size: 22px;}
        .header p { margin: 0; color: #1a8c4b; font-size: 14px; font-weight: bold;}
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 2;
            text-align: center;
        }
        .content h1 {
            color: #d4af37;
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 5px;
        }
        .content h3 {
            color: #1a8c4b;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 40px;
        }
        
        /* مربعات كود التفعيل */
        .code-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            direction: ltr; /* من اليسار لليمين للكود */
        }
        .code-inputs input {
            width: 45px;
            height: 55px;
            font-size: 26px;
            text-align: center;
            border: 2px solid #1a8c4b;
            border-radius: 10px;
            color: #333;
            font-weight: bold;
            outline: none;
            transition: 0.3s;
        }
        .code-inputs input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }
        
        .btn {
            background-color: #1a8c4b;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 80%;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 4px 15px rgba(26, 140, 75, 0.3);
            transition: 0.3s;
        }
        .btn:hover { 
            background-color: #146c38; 
            transform: scale(1.05);
        }
        
        .footer {
            text-align: center;
            padding: 30px;
            z-index: 2;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- الشعار -->
        <div class="header">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15ZM12 2v20M8 6h3M8 10h3M16 6h-3M16 10h-3"/>
            </svg>
            <h2>مكتبة إسلام</h2>
            <p>Maktabat Islam</p>
        </div>
        
        <!-- المحتوى -->
        <div class="content">
            <h1>الكتاب الذكي</h1>
            <h3>أدخل كود التفعيل</h3>
            
            <!-- خانات الكود -->
            <div class="code-inputs">
                <input type="text" maxlength="1" autofocus>
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
            </div>
            
            <button class="btn" onclick="activateBook()">دخول</button>
        </div>
        
        <!-- الفوتر -->
        <div class="footer">
            إعداد فريق تقني مختص
        </div>
    </div>

    <!-- كود الجافاسكريبت البسيط للانتقال بين المربعات -->
    <script>
        const inputs = document.querySelectorAll('.code-inputs input');
        
        inputs.forEach((input, index) => {
            // الانتقال للمربع التالي تلقائيا
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            
            // الرجوع للمربع السابق عند المسح
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // رسالة مؤقتة عند الضغط على دخول
        function activateBook() {
            alert("تم إدخال الكود! الخطوة القادمة هي برمجة توجيه المستخدم للمحتوى.");
        }
    </script>
</body>
</html>
