<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكتاب الذكي - مكتبة إسلام</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* حاوية التطبيق الرئيسية */
        .app-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            height: 100vh; 
            max-height: 800px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }
        
        /* الإطارات الزخرفية */
        .app-container::before {
            content: ''; position: absolute; top: 15px; bottom: 15px; left: 15px; right: 15px;
            border: 2px solid #d4af37; border-radius: 15px; pointer-events: none; z-index: 10;
        }
        .app-container::after {
            content: ''; position: absolute; top: 22px; bottom: 22px; left: 22px; right: 22px;
            border: 1px dashed #1a8c4b; border-radius: 10px; pointer-events: none; z-index: 10;
        }
        
        .header { text-align: center; margin-top: 40px; z-index: 2; }
        .logo-icon { width: 45px; fill: none; stroke: #1a8c4b; stroke-width: 1.5; margin-bottom: 5px;}
        .header h2 { margin: 0; color: #1a8c4b; font-weight: 900; font-size: 20px;}
        
        /* شاشات التطبيق */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 35px;
            z-index: 2;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        .hidden {
            display: none !important;
            opacity: 0;
            transform: translateX(-20px);
        }
        
        /* --- تصميم شاشة التفعيل (الأولى) --- */
        #activation-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #activation-screen h1 { color: #d4af37; font-size: 36px; font-weight: 900; margin-bottom: 5px; }
        #activation-screen h3 { color: #1a8c4b; font-size: 18px; margin-top: 0; margin-bottom: 30px; }
        
        .code-inputs { display: flex; gap: 10px; margin-bottom: 40px; direction: ltr; }
        .code-inputs input {
            width: 45px; height: 55px; font-size: 26px; text-align: center;
            border: 2px solid #1a8c4b; border-radius: 10px; color: #333; font-weight: bold; outline: none; transition: 0.3s;
        }
        .code-inputs input:focus { border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); transform: translateY(-2px); }
        
        /* --- تصميم شاشة الاختيار (الثانية) --- */
        #selection-screen {
            justify-content: flex-start;
            padding-top: 20px;
        }
        .section-title {
            color: #d4af37;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 12px;
            text-align: right;
            width: 100%;
        }
        
        /* تصميم البطاقات والأزرار */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
        
        /* بطاقات الرواية (كبيرة) */
        .riwaya-card {
            background-color: #fdfdfc;
            border: 2px solid #e0e0e0;
            color: #555;
            padding: 25px 10px; /* طول البطاقة */
            border-radius: 15px;
            font-family: 'Tajawal', sans-serif;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* أزرار الأجزاء (عادية) */
        .juz-btn {
            background-color: #fdfdfc;
            border: 2px solid #e0e0e0;
            color: #555;
            padding: 12px 10px;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        /* التأثير عند الاختيار */
        .selected-card {
            background-color: #1a8c4b !important;
            color: #fff !important;
            border-color: #1a8c4b !important;
            box-shadow: 0 5px 15px rgba(26, 140, 75, 0.3);
            transform: translateY(-3px);
        }
        
        /* كلاس لإخفاء الأقسام وإظهارها بنعومة */
        .step-hidden {
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
        }
        .step-visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
            margin-top: 20px;
        }
        
        /* زر البداية */
        .btn-primary {
            background-color: #1a8c4b; color: white; border: none; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            width: 100%; font-family: 'Tajawal', sans-serif; transition: 0.3s;
            margin-top: auto; 
            margin-bottom: 20px;
        }
        .btn-primary:hover { background-color: #146c38; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(26, 140, 75, 0.3);}
    </style>
</head>
<body>
    <div class="app-container">
        <!-- الشعار -->
        <div class="header">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15ZM12 2v20M8 6h3M8 10h3M16 6h-3M16 10h-3"/>
            </svg>
            <h2>مكتبة إسلام</h2>
        </div>
        
        <!-- ================= الشاشة 1: التفعيل ================= -->
        <div id="activation-screen" class="screen">
            <h1>الكتاب الذكي</h1>
            <h3>أدخل كود التفعيل</h3>
            
            <div class="code-inputs">
                <input type="text" maxlength="1" autofocus>
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
            </div>
            
            <button class="btn-primary" onclick="goToSelection()">تأكيد الكود</button>
        </div>

        <!-- ================= الشاشة 2: الاختيارات المتسلسلة ================= -->
        <div id="selection-screen" class="screen hidden">
            
            <!-- الخطوة 1: اختيار الرواية (تظهر أولاً) -->
            <div id="step-1">
                <div class="section-title">1. اختر الرواية:</div>
                <div class="options-grid">
                    <button class="riwaya-card" onclick="selectRiwaya(this)">ورش عن نافع</button>
                    <button class="riwaya-card" onclick="selectRiwaya(this)">حفص عن عاصم</button>
                </div>
            </div>

            <!-- الخطوة 2: اختيار الجزء (مخفية في البداية) -->
            <div id="step-2" class="step-hidden">
                <div class="section-title">2. اختر الجزء:</div>
                <div class="options-grid">
                    <button class="juz-btn" onclick="selectJuz(this)">جزء عمّ</button>
                    <button class="juz-btn" onclick="selectJuz(this)">جزء تبارك</button>
                    <button class="juz-btn" onclick="selectJuz(this)">جزء قد سمع</button>
                    <button class="juz-btn" onclick="selectJuz(this)">الجزء الثامن</button>
                </div>
            </div>
            
            <!-- الخطوة 3: زر البداية (مخفي في البداية) -->
            <div id="step-3" class="step-hidden" style="margin-top: auto;">
                <button class="btn-primary" onclick="startJourney()">ابدأ رحلة الحفظ</button>
            </div>

        </div>
    </div>

    <script>
        // --- سكربت خانات الكود ---
        const inputs = document.querySelectorAll('.code-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) inputs[index - 1].focus();
            });
        });

        // --- الانتقال للشاشة الثانية ---
        function goToSelection() {
            document.getElementById('activation-screen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('selection-screen').classList.remove('hidden');
            }, 100);
        }

        // --- عند اختيار الرواية ---
        function selectRiwaya(btn) {
            // تلوين البطاقة
            let cards = document.querySelectorAll('.riwaya-card');
            cards.forEach(c => c.classList.remove('selected-card'));
            btn.classList.add('selected-card');
            
            // إظهار قسم الأجزاء بنعومة
            let step2 = document.getElementById('step-2');
            step2.style.display = 'block';
            setTimeout(() => {
                step2.classList.remove('step-hidden');
                step2.classList.add('step-visible');
            }, 50);
        }

        // --- عند اختيار الجزء ---
        function selectJuz(btn) {
            // تلوين الزر
            let buttons = document.querySelectorAll('.juz-btn');
            buttons.forEach(b => b.classList.remove('selected-card'));
            btn.classList.add('selected-card');
            
            // إظهار زر البداية بنعومة
            let step3 = document.getElementById('step-3');
            step3.style.display = 'block';
            setTimeout(() => {
                step3.classList.remove('step-hidden');
                step3.classList.add('step-visible');
            }, 50);
        }

        // --- زر البداية ---
        function startJourney() {
            alert("ممتاز! سيتم الآن توجيهك إلى واجهة الحفظ...");
        }
    </script>
</body>
</html>
