<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكتاب الذكي - مكتبة إسلام</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        /* حاوية التطبيق الرئيسية */
        .app-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            height: 100vh; 
            max-height: 800px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* لمنع خروج المحتوى أثناء الانتقال */
        }
        
        /* الإطارات الزخرفية */
        .app-container::before {
            content: ''; position: absolute; top: 15px; bottom: 15px; left: 15px; right: 15px;
            border: 2px solid #d4af37; border-radius: 15px; pointer-events: none; z-index: 10;
        }
        .app-container::after {
            content: ''; position: absolute; top: 22px; bottom: 22px; left: 22px; right: 22px;
            border: 1px dashed #1a8c4b; border-radius: 10px; pointer-events: none; z-index: 10;
        }
        
        .header { text-align: center; margin-top: 40px; z-index: 2; }
        .logo-icon { width: 45px; fill: none; stroke: #1a8c4b; stroke-width: 1.5; margin-bottom: 5px;}
        .header h2 { margin: 0; color: #1a8c4b; font-weight: 900; font-size: 20px;}
        
        /* شاشات التطبيق */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 35px;
            z-index: 2;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        /* إخفاء الشاشة غير النشطة */
        .hidden {
            display: none !important;
            opacity: 0;
            transform: translateX(-20px);
        }
        
        /* --- تصميم شاشة التفعيل (الأولى) --- */
        #activation-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #activation-screen h1 { color: #d4af37; font-size: 36px; font-weight: 900; margin-bottom: 5px; }
        #activation-screen h3 { color: #1a8c4b; font-size: 18px; margin-top: 0; margin-bottom: 30px; }
        
        .code-inputs { display: flex; gap: 10px; margin-bottom: 40px; direction: ltr; }
        .code-inputs input {
            width: 45px; height: 55px; font-size: 26px; text-align: center;
            border: 2px solid #1a8c4b; border-radius: 10px; color: #333; font-weight: bold; outline: none; transition: 0.3s;
        }
        .code-inputs input:focus { border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); transform: translateY(-2px); }
        
        /* --- تصميم شاشة الاختيار (الثانية) --- */
        #selection-screen {
            justify-content: flex-start;
            padding-top: 30px;
        }
        .section-title {
            color: #d4af37;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 15px;
            text-align: right;
            width: 100%;
        }
        
        /* أزرار الاختيار (رواية وجزء) */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
        }
        .option-btn {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            color: #555;
            padding: 15px 10px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        /* تأثير عند اختيار الزر */
        .option-btn.selected {
            background-color: #1a8c4b;
            color: #fff;
            border-color: #1a8c4b;
            box-shadow: 0 4px 10px rgba(26, 140, 75, 0.2);
        }
        
        /* الأزرار الرئيسية */
        .btn-primary {
            background-color: #1a8c4b; color: white; border: none; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            width: 100%; font-family: 'Tajawal', sans-serif; transition: 0.3s;
            margin-top: auto; /* لدفعه للأسفل */
            margin-bottom: 20px;
        }
        .btn-primary:hover { background-color: #146c38; transform: translateY(-2px); }
        .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- الشعار (ثابت في كل الشاشات) -->
        <div class="header">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15ZM12 2v20M8 6h3M8 10h3M16 6h-3M16 10h-3"/>
            </svg>
            <h2>مكتبة إسلام</h2>
        </div>
        
        <!-- ================= الشاشة 1: التفعيل ================= -->
        <div id="activation-screen" class="screen">
            <h1>الكتاب الذكي</h1>
            <h3>أدخل كود التفعيل</h3>
            
            <div class="code-inputs">
                <input type="text" maxlength="1" autofocus>
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
            </div>
            
            <button class="btn-primary" onclick="goToSelection()">تأكيد الكود</button>
        </div>

        <!-- ================= الشاشة 2: اختيار الرواية والجزء ================= -->
        <div id="selection-screen" class="screen hidden">
            
            <!-- اختيار الرواية -->
            <div class="section-title">1. اختر الرواية:</div>
            <div class="options-grid" id="riwaya-options">
                <button class="option-btn" onclick="selectOption(this, 'riwaya')">ورش عن نافع</button>
                <button class="option-btn" onclick="selectOption(this, 'riwaya')">حفص عن عاصم</button>
            </div>

            <!-- اختيار الجزء -->
            <div class="section-title">2. اختر الجزء:</div>
            <div class="options-grid" id="juz-options">
                <button class="option-btn" onclick="selectOption(this, 'juz')">جزء عمّ</button>
                <button class="option-btn" onclick="selectOption(this, 'juz')">جزء تبارك</button>
                <button class="option-btn" onclick="selectOption(this, 'juz')">جزء قد سمع</button>
                <button class="option-btn" onclick="selectOption(this, 'juz')">الجزء الثامن</button>
            </div>
            
            <button id="start-btn" class="btn-primary" disabled onclick="startJourney()">ابدأ رحلة الحفظ</button>
        </div>
    </div>

    <script>
        // --- سكربت الانتقال بين خانات الكود ---
        const inputs = document.querySelectorAll('.code-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) inputs[index - 1].focus();
            });
        });

        // --- سكربت الانتقال السلس للشاشة الثانية ---
        function goToSelection() {
            // إخفاء الشاشة الأولى
            document.getElementById('activation-screen').classList.add('hidden');
            // إظهار الشاشة الثانية بعد جزء من الثانية ليكون الانتقال ناعماً
            setTimeout(() => {
                document.getElementById('selection-screen').classList.remove('hidden');
            }, 100);
        }

        // --- سكربت اختيار الرواية والجزء ---
        let selectedRiwaya = false;
        let selectedJuz = false;

        function selectOption(btn, type) {
            // إزالة التحديد عن الأزرار الأخرى في نفس المجموعة
            const container = btn.parentElement;
            const buttons = container.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.remove('selected'));
            
            // تفعيل الزر المضغوط
            btn.classList.add('selected');

            // التحقق من أن المستخدم اختار رواية وجزء لتفعيل زر البداية
            if (type === 'riwaya') selectedRiwaya = true;
            if (type === 'juz') selectedJuz = true;

            if (selectedRiwaya && selectedJuz) {
                document.getElementById('start-btn').disabled = false;
            }
        }

        // --- سكربت زر البداية ---
        function startJourney() {
            alert("ممتاز! جاري تجهيز بيئة الحفظ الرقمية...");
            // هنا سنبرمج لاحقاً الانتقال لصفحة المحتوى الخاص بالجزء
        }
    </script>
</body>
</html>
