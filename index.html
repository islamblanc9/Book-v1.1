<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الكتاب الذكي - مكتبة إسلام</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: #e9ecef; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        
        .app-container {
            background-color: #ffffff;
            width: 100%; max-width: 420px;
            height: 100vh; max-height: 850px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        
        .app-container::before {
            content: ''; position: absolute; top: 12px; bottom: 12px; left: 12px; right: 12px;
            border: 2.5px solid #d4af37; pointer-events: none; z-index: 10;
        }
        .app-container::after {
            content: ''; position: absolute; top: 20px; bottom: 20px; left: 20px; right: 20px;
            border: 1.5px solid #1a8c4b; pointer-events: none; z-index: 10;
        }

        .corner-dec { position: absolute; width: 22px; height: 22px; border: 2.5px solid #d4af37; background-color: #fff; z-index: 11; }
        .tl { top: 3px; left: 3px; border-radius: 50% 0 50% 0; }
        .tr { top: 3px; right: 3px; border-radius: 0 50% 0 50%; }
        .bl { bottom: 3px; left: 3px; border-radius: 0 50% 0 50%; }
        .br { bottom: 3px; right: 3px; border-radius: 50% 0 50% 0; }
        
        .header { text-align: center; margin-top: 35px; z-index: 12; padding: 0 30px; }
        .logo-icon { width: 55px; fill: none; stroke: #1a8c4b; stroke-width: 1.5; }
        .header h2 { margin: 5px 0 0 0; color: #1a8c4b; font-weight: 900; font-size: 24px; }
        .header p { margin: 0; color: #d4af37; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        
        .screen {
            flex: 1; display: flex; flex-direction: column;
            padding: 20px 35px 0; z-index: 12;
            transition: opacity 0.4s ease, transform 0.4s ease;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .screen::-webkit-scrollbar { display: none; }
        .hidden { display: none !important; opacity: 0; transform: scale(0.98); }

        .section-title {
            color: #d4af37; font-size: 28px; font-weight: 700;
            margin-bottom: 10px; text-align: center; font-family: 'Amiri', serif;
        }
        
        /* شارة الرواية المختارة (العنوان الفرعي) */
        .badge-container { text-align: center; width: 100%; margin-bottom: 25px; }
        .riwaya-badge {
            background-color: #f4fcf7; color: #1a8c4b; border: 1.5px solid #1a8c4b;
            padding: 6px 15px; border-radius: 20px; font-size: 13px; font-family: 'Tajawal', sans-serif;
            font-weight: 700; display: inline-block;
        }

        .activation-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; }
        .activation-wrapper h3 { color: #1a8c4b; font-size: 18px; margin-bottom: 25px; font-weight: 700; }
        
        .code-inputs { 
            display: flex; gap: 8px; margin-bottom: 40px; direction: ltr;
            justify-content: center; width: 100%;
        }
        .code-inputs input {
            width: 48px; max-width: 18%; height: 55px; font-size: 28px; text-align: center;
            border: 2px solid #1a8c4b; border-radius: 8px; color: #1a8c4b; font-weight: 900;
            outline: none; transition: 0.3s; background-color: #fdfdfc; font-family: sans-serif;
            padding: 0;
        }
        .code-inputs input:focus { border-color: #d4af37; box-shadow: 0 0 12px rgba(212, 175, 55, 0.4); transform: translateY(-3px); }

        .options-grid { display: grid; gap: 12px; width: 100%; }
        .card-btn {
            background-color: #fff; border: 1.5px solid #ddd; color: #444;
            padding: 18px 15px; border-radius: 10px; font-family: 'Tajawal', sans-serif;
            font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s;
            position: relative; overflow: hidden; text-align: center;
            width: 100%;
        }
        .card-btn::before {
            content: ''; position: absolute; top: 0; right: 0; width: 5px; height: 100%; background-color: #d4af37;
            transform: scaleY(0); transition: 0.3s; transform-origin: bottom;
        }
        .card-btn:hover { border-color: #d4af37; transform: translateY(-2px); }
        .selected-card {
            background-color: #1a8c4b !important; color: #fff !important; border-color: #1a8c4b !important;
            box-shadow: 0 6px 15px rgba(26, 140, 75, 0.25); transform: translateY(-3px) !important;
        }
        .selected-card::before { transform: scaleY(1); background-color: #d4af37; }
        
        .surah-list {
            display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto; padding-bottom: 20px;
            width: 100%;
        }
        .surah-list::-webkit-scrollbar { width: 5px; }
        .surah-list::-webkit-scrollbar-thumb { background-color: #d4af37; border-radius: 10px; }
        
        .surah-btn {
            background-color: #fdfdfc; border: 1.5px solid #e0e0e0; border-radius: 8px;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            color: #1a8c4b; font-family: 'Amiri', serif; font-size: 22px; font-weight: 700;
            cursor: pointer; transition: 0.3s; text-align: right; width: 100%;
        }
        .surah-btn:hover { border-color: #d4af37; background-color: #f4fcf7; transform: translateX(-3px); }
        
        .surah-number {
            background-color: #d4af37; color: #fff; width: 32px; height: 32px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 15px; font-family: 'Tajawal', sans-serif; font-weight: bold; flex-shrink: 0;
        }

        .bottom-actions { margin-top: auto; margin-bottom: 10px; display: flex; gap: 10px; padding-top: 20px; width: 100%;}
        .btn-primary {
            background-color: #d4af37; color: #fff; border: none; padding: 15px;
            font-size: 18px; font-weight: 900; border-radius: 8px; cursor: pointer;
            flex: 1; font-family: 'Tajawal', sans-serif; transition: 0.3s;
        }
        .btn-primary:hover { background-color: #b8962c; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);}
        .btn-primary:disabled { background-color: #e0e0e0; color: #999; cursor: not-allowed; transform: none; box-shadow: none;}
        
        .btn-secondary {
            background-color: #fff; color: #1a8c4b; border: 2px solid #1a8c4b; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
            width: 30%; font-family: 'Tajawal', sans-serif; transition: 0.3s;
        }
        .btn-secondary:hover { background-color: #f4fcf7; }

        .footer {
            text-align: center; padding: 15px 30px 30px; z-index: 12;
            font-size: 11px; color: #666; font-family: 'Tajawal', sans-serif; line-height: 1.6; width: 100%;
        }
        .footer strong { color: #1a8c4b; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="corner-dec tl"></div>
        <div class="corner-dec tr"></div>
        <div class="corner-dec bl"></div>
        <div class="corner-dec br"></div>
        
        <div class="header">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15ZM12 2v20M8 6h3M8 10h3M16 6h-3M16 10h-3"/>
            </svg>
            <h2>مكتبة إسلام</h2>
            <p>MAKTABAT ISLAM</p>
        </div>
        
        <!-- الشاشة 1: كود التفعيل -->
        <div id="activation-screen" class="screen">
            <div class="activation-wrapper">
                <div class="section-title">الكتاب الذكي</div>
                <h3>الرجاء إدخال كود التفعيل</h3>
                <div class="code-inputs">
                    <input type="text" maxlength="1" autofocus>
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                </div>
                <div class="bottom-actions">
                    <button class="btn-primary" onclick="goToRiwayaScreen()">دخول</button>
                </div>
            </div>
        </div>

        <!-- الشاشة 2: اختيار الرواية -->
        <div id="riwaya-screen" class="screen hidden">
            <div class="section-title" style="margin-bottom: 25px;">اختر الرواية</div>
            <div class="options-grid">
                <button class="card-btn riwaya-btn" onclick="selectRiwaya(this)">رواية ورش عن نافع</button>
                <button class="card-btn riwaya-btn" onclick="selectRiwaya(this)">رواية حفص عن عاصم</button>
            </div>
            <div class="bottom-actions">
                <button id="next-btn" class="btn-primary" disabled onclick="goToJuzScreen()">التالي</button>
            </div>
        </div>

        <!-- الشاشة 3: اختيار الجزء -->
        <div id="juz-screen" class="screen hidden">
            <div class="section-title">اختر الجزء</div>
            <!-- العنوان الفرعي للرواية -->
            <div class="badge-container">
                <span class="riwaya-badge" id="juz-riwaya-badge"></span>
            </div>

            <div class="options-grid">
                <button class="card-btn juz-btn" data-juz="عم" onclick="selectJuz(this)">جزء عمّ</button>
                <button class="card-btn juz-btn" data-juz="تبارك" onclick="selectJuz(this)">جزء تبارك</button>
                <button class="card-btn juz-btn" data-juz="قدسمع" onclick="selectJuz(this)">جزء قد سمع</button>
                <button class="card-btn juz-btn" data-juz="الذاريات" onclick="selectJuz(this)">جزء الذاريات</button>
                <button class="card-btn juz-btn" data-juz="الأحقاف" onclick="selectJuz(this)">جزء الأحقاف</button>
            </div>
            <div class="bottom-actions">
                <button class="btn-secondary" onclick="goBack('riwaya')">رجوع</button>
                <button id="start-btn" class="btn-primary" disabled onclick="goToSurahScreen()">التالي</button>
            </div>
        </div>

        <!-- الشاشة 4: السور -->
        <div id="surah-screen" class="screen hidden">
            <div class="section-title" id="surah-title">اختر السورة</div>
            <!-- العنوان الفرعي للرواية -->
            <div class="badge-container">
                <span class="riwaya-badge" id="surah-riwaya-badge"></span>
            </div>

            <div class="surah-list" id="surah-container"></div>
            <div class="bottom-actions">
                <button class="btn-secondary" onclick="goBack('juz')">رجوع</button>
            </div>
        </div>

        <div class="footer">
            جميع الحقوق والنشر والطبع محفوظة<br>
            <strong>لدى مكتبة إسلام - عنابة ©</strong>
        </div>
    </div>

    <script>
        const surahData = {
            "عم": ["النبأ", "النازعات", "عبس", "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"],
            "تبارك": ["الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات"],
            "قدسمع": ["المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم"],
            "الذاريات": ["الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد"],
            "الأحقاف": ["الأحقاف", "محمد", "الفتح", "الحجرات", "ق"]
        };

        let selectedJuzKey = "";
        let selectedRiwayaText = ""; // متغير لحفظ اسم الرواية

        const inputs = document.querySelectorAll('.code-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) inputs[index - 1].focus();
            });
        });

        function goToRiwayaScreen() {
            document.getElementById('activation-screen').classList.add('hidden');
            document.getElementById('riwaya-screen').classList.remove('hidden');
        }

        function selectRiwaya(btn) {
            document.querySelectorAll('.riwaya-btn').forEach(b => b.classList.remove('selected-card'));
            btn.classList.add('selected-card');
            
            // نحفظو اسم الرواية (مثلا: "رواية ورش عن نافع")
            selectedRiwayaText = btn.innerText; 
            document.getElementById('next-btn').disabled = false;
        }

        function goToJuzScreen() {
            // نكتبو اسم الرواية في الشارة تاع شاشة الأجزاء
            document.getElementById('juz-riwaya-badge').innerText = "الرواية المختارة: " + selectedRiwayaText;
            
            document.getElementById('riwaya-screen').classList.add('hidden');
            document.getElementById('juz-screen').classList.remove('hidden');
        }

        function selectJuz(btn) {
            document.querySelectorAll('.juz-btn').forEach(b => b.classList.remove('selected-card'));
            btn.classList.add('selected-card');
            selectedJuzKey = btn.getAttribute('data-juz');
            document.getElementById('start-btn').disabled = false;
        }

        function goToSurahScreen() {
            const container = document.getElementById('surah-container');
            const surahScreen = document.getElementById('surah-screen');
            
            container.innerHTML = ""; 
            
            const surahs = surahData[selectedJuzKey];
            surahs.forEach((surahName, index) => {
                const btn = document.createElement('div');
                btn.className = 'surah-btn';
                btn.onclick = () => openSurahContent(surahName);
                
                btn.innerHTML = `
                    <span>سُورَةُ ${surahName}</span>
                    <div class="surah-number">${index + 1}</div>
                `;
                container.appendChild(btn);
            });

            document.getElementById('surah-title').innerText = "سور جزء " + selectedJuzKey;
            
            // نكتبو اسم الرواية في الشارة تاع شاشة السور ثاني
            document.getElementById('surah-riwaya-badge').innerText = "الرواية المختارة: " + selectedRiwayaText;
            
            document.getElementById('juz-screen').classList.add('hidden');
            surahScreen.classList.remove('hidden');

            setTimeout(() => {
                surahScreen.scrollTop = 0;
                container.scrollTop = 0;
            }, 50);
        }

        function goBack(toScreen) {
            if(toScreen === 'riwaya') {
                document.getElementById('juz-screen').classList.add('hidden');
                document.getElementById('riwaya-screen').classList.remove('hidden');
            } else if(toScreen === 'juz') {
                document.getElementById('surah-screen').classList.add('hidden');
                document.getElementById('juz-screen').classList.remove('hidden');
            }
        }

        function openSurahContent(surahName) {
            alert("سيتم نقلك لصفحة تلاوة وتدبر سورة: " + surahName + " (" + selectedRiwayaText + ")");
        }
    </script>
</body>
</html>
